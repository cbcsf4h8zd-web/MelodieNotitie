<style>
:root{--ink:#eef2f7;--muted:#9aa8ba;--panel:rgba(10,16,26,.92);--line:#2a3a52;--gold:#f5b531;--red:#e5484d;--blue:#3b82f6;--green:#22c55e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#07101d;color:var(--ink);font:14px/1.35 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;-webkit-user-select:none;user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
.hidden{display:none!important}
button{font:inherit;color:inherit}
/* HUD */
#hud{position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top));display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:4}
#me{pointer-events:auto;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 10px;min-width:0;flex:1;max-width:330px}
#me .nm{display:flex;align-items:center;gap:7px;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#me .flag{width:16px;height:12px;border-radius:3px;border:2px solid #000;flex:none}
#me .bar{height:7px;border-radius:4px;background:#1c2a3f;margin:6px 0 3px;overflow:hidden}
#me .bar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#a3e635);border-radius:4px}
#me .row{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted);font-weight:600}
#me .row b{color:var(--ink)}
#focusLine{font-size:11.5px;margin-top:4px;color:var(--muted);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#focusLine.pick{color:var(--gold)}
.fm{border:1px solid var(--line);background:#132033;border-radius:13px;padding:10px;margin-top:8px}
.fm.ok{border-color:var(--gold);background:#2b2410}
.fm.gone{opacity:.5}
.fm .t{display:flex;align-items:center;gap:9px}
.fm .t img{width:42px;height:28px;border:1.5px solid #000;border-radius:3px;flex:none}
.fm .t b{font-size:15px;line-height:1.15}
.fm .t small{display:block;color:var(--muted);font-size:11.5px;font-weight:700}
.fm .pb{height:8px;border-radius:4px;background:#24364f;margin:8px 0 6px;overflow:hidden}
.fm .pb i{display:block;height:100%;background:linear-gradient(90deg,#f59e0b,#fde047)}
.fm .cs{display:flex;flex-wrap:wrap;gap:4px}
.fm .cs span{font-size:11px;font-weight:700;padding:2px 6px;border-radius:7px;background:#1c2a3f;color:var(--muted)}
.fm .cs span.g{background:#14532d;color:#bbf7d0}
.fm button{width:100%;margin-top:8px;min-height:42px;border-radius:11px;border:1px solid var(--gold);background:var(--gold);color:#1b1206;font-weight:900;font-size:15px}
#bForm.glow,#bInt.glow,#bFocus.glow{border-color:var(--gold);box-shadow:0 0 0 2px rgba(245,181,49,.5)}
.ftree{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.fn{min-height:70px;border-radius:12px;border:1px solid var(--line);background:#15243a;font-size:11.5px;font-weight:800;padding:6px 4px;line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.fn i{font-style:normal;font-size:20px}
.fn small{font-weight:600;color:var(--muted);font-size:10px;margin-top:3px}
.fn.done{background:#14532d;border-color:#22c55e}
.fn.cur{background:#3b2a07;border-color:var(--gold)}
.fn.q{border-color:var(--gold);background:#2b2410;position:relative}
.fn.q .qn{position:absolute;top:4px;right:6px;background:var(--gold);color:#1b1206;border-radius:9px;font-size:11px;font-weight:900;padding:0 6px}
.fn.qa{border-color:#a78bfa;border-style:dashed}
.fn.ok{border-color:#60a5fa;box-shadow:inset 0 0 0 1px #60a5fa}
.fn.lock{opacity:.4}
.fn.x{opacity:.22;text-decoration:line-through}
.fn.e{visibility:hidden}
.ftabs{display:flex;gap:5px;overflow-x:auto;padding-bottom:4px;margin-top:8px}
.ftabs button{flex:none;border:1px solid var(--line);background:#132033;color:var(--muted);border-radius:10px;padding:7px 10px;font-weight:800;font-size:12.5px;position:relative}
.ftabs button.on{background:#24364f;color:var(--ink);border-color:#60a5fa}
.ftabs button b{position:absolute;top:-6px;right:-5px;background:var(--gold);color:#1b1206;border-radius:9px;font-size:10px;padding:1px 5px}
.fn .rq{font-size:9.5px;color:#93a3b8;font-weight:700;margin-top:2px}
.fe{display:grid;grid-template-columns:1fr;gap:10px;margin-top:8px}
.fe canvas{width:min(100%,300px);height:auto;display:block;margin:0 auto;border:2px solid #000;border-radius:4px;background:#fff}
.fe .pal{display:flex;flex-wrap:wrap;gap:5px}
.fe .pal button{width:30px;height:30px;border-radius:8px;border:2px solid #0008}
.fe .pal button.on{outline:3px solid var(--gold);outline-offset:1px}
.fe .slot{display:flex;gap:6px}
.fe .slot button{flex:1;min-height:34px;border-radius:9px;border:1px solid var(--line);background:#132033;color:var(--ink);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;gap:6px}
.fe .slot button.on{border-color:var(--gold);background:#2b2410}
.fe .slot i{width:16px;height:16px;border-radius:4px;border:1.5px solid #000;display:inline-block}
.fe input[type=text]{width:100%;min-height:42px;border-radius:10px;border:1px solid var(--line);background:#0b1422;color:var(--ink);padding:0 12px;font-size:15px;font-weight:700}
.frow{grid-column:1/-1;font-size:10.5px;color:var(--muted);font-weight:800;letter-spacing:.06em;margin-top:8px}
#tr{display:flex;flex-direction:column;gap:6px;pointer-events:auto;margin-top:30px}
#tr div{display:flex;gap:6px}
.tb{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-size:19px;display:flex;align-items:center;justify-content:center}
/* banners */
#peace,#alert{position:fixed;left:8px;top:calc(118px + env(safe-area-inset-top));max-width:calc(100% - 128px)!important;white-space:normal;font-size:12px!important;z-index:5;border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px;max-width:calc(100% - 20px);text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.45)}
#peace{background:#12314f;border:1px solid #3b82f6}
#alert{background:#7f1d1d;border:2px solid var(--red);display:flex;gap:8px;align-items:center;pointer-events:auto;white-space:normal}
#alert b{background:#fff;color:#7f1d1d;border-radius:8px;padding:4px 8px;font-size:12px;white-space:nowrap}
#toasts{position:fixed;left:8px;right:8px;bottom:calc(150px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:6}
#toasts div{background:rgba(8,14,24,.95);border:1px solid var(--line);border-radius:11px;padding:8px 12px;font-weight:700;font-size:13px;max-width:100%;animation:tin .2s ease-out}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
#toasts.up{bottom:calc(300px + env(safe-area-inset-bottom))}
/* bottom */
#bottom{position:fixed;left:0;right:0;bottom:0;padding:8px 8px calc(8px + env(safe-area-inset-bottom));z-index:4;pointer-events:none}
#bottom>*{pointer-events:auto}
#card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:11px;margin-bottom:8px;box-shadow:0 8px 28px rgba(0,0,0,.5)}
#card .hd{display:flex;align-items:center;gap:8px}
#card .ttl{font-weight:800;font-size:16px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#card .rel{font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px;background:#1d2b40;color:var(--muted);white-space:nowrap}
#card .info{font-size:12.5px;color:var(--muted);margin:5px 0 9px}
#card .btns{display:grid;grid-template-columns:1fr 1fr;gap:7px}
#card .btns button{min-height:46px;border-radius:12px;border:1px solid var(--line);background:#15243a;font-weight:800;font-size:14px}
#card .btns .atk{background:#b91c1c;border-color:#ef4444;color:#fff}
#card .btns .ally{background:#1d4ed8;border-color:#60a5fa;color:#fff}
#card .btns .go{background:#15803d;border-color:#22c55e;color:#fff}
#card .btns .wide{grid-column:1/-1}
#card .dip{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-top:6px}
#card .dip button{min-height:38px;border-radius:10px;border:1px solid var(--line);background:#132033;color:var(--ink);font-weight:800;font-size:11.5px;line-height:1.15;padding:2px 3px}
#card .dip button small{display:block;color:var(--muted);font-weight:700;font-size:10px}
#card .btns button:disabled{opacity:.4}
#card .hint{font-size:12px;color:var(--gold);margin-top:8px;font-weight:700}
#bar{display:flex;gap:6px;align-items:stretch}
.seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:3px;gap:3px}
.seg button{border:0;background:transparent;border-radius:10px;padding:0 10px;min-height:42px;font-weight:800;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button.on{background:#24364f;color:var(--ink)}
#mode button.on[data-m="front"]{background:var(--gold);color:#1b1206}
#pct{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:3px 12px}
#pct input{flex:1;min-width:0;width:40px}
#pct span{flex:none}
#pct b{font-size:13.5px;min-width:40px;text-align:right}
input[type=range]{-webkit-appearance:none;appearance:none;height:8px;border-radius:4px;background:#24364f;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--gold);border:3px solid #1b1206}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--gold);border:3px solid #1b1206}
.trp{background:#132033;border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-top:8px}
.trp .tl{display:flex;justify-content:space-between;font-size:13px;font-weight:800;margin-bottom:6px}
.trp .tl span{color:var(--muted);font-weight:700}
.trp input{width:100%}
.trp .qk{display:flex;gap:5px;margin-top:7px}
.trp .qk button{flex:1;min-height:32px;border-radius:9px;border:1px solid var(--line);background:#1c2a3f;color:var(--ink);font-weight:800;font-size:12.5px}
.fimg{width:22px;height:15px;border:1.5px solid #000;border-radius:2px;flex:none;object-fit:cover}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}
.fgrid button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:7px 3px;border-radius:11px;border:1px solid var(--line);background:#132033;color:var(--ink);font-size:11px;font-weight:700}
.fgrid button.on{border-color:var(--gold);background:#2b2410}
.fgrid img{width:54px;height:36px;border:1.5px solid #000;border-radius:3px;object-fit:cover}
#pctLbl{font-size:10.5px;color:#cfd8e6;font-weight:800;letter-spacing:.05em;margin:0 0 4px 0;display:inline-block;background:rgba(10,16,26,.85);border-radius:6px;padding:2px 7px}
/* overlay */
#ov{position:fixed;inset:0;z-index:10;background:rgba(3,7,13,.78);display:flex;align-items:center;justify-content:center;padding:14px;overflow:auto}
#ovc{background:#0d1726;border:1px solid var(--line);border-radius:20px;padding:18px 16px;width:100%;max-width:440px;max-height:calc(100% - 10px);overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.6)}
#ovc h2{margin:0 0 4px;font-size:22px}
#ovc h2.big{font-size:27px;letter-spacing:.02em}
#ovc p{margin:6px 0;color:var(--muted)}
.lab{font-size:11.5px;font-weight:800;letter-spacing:.07em;color:var(--muted);margin:14px 0 6px;text-transform:uppercase}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opts button{flex:1 1 auto;min-height:42px;border-radius:11px;border:1px solid var(--line);background:#15243a;font-weight:800;font-size:13.5px;padding:0 10px}
.opts button.on{background:var(--gold);color:#1b1206;border-color:var(--gold)}
.big{display:block;width:100%;min-height:52px;border-radius:14px;border:0;font-weight:900;font-size:16px;margin-top:14px;background:#15243a;color:var(--ink);border:1px solid var(--line)}
.big.red{background:linear-gradient(180deg,#e5484d,#b91c1c);border:0;color:#fff}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.logo b{font-size:25px;font-weight:900;letter-spacing:-.01em}
.logo b span{color:var(--gold)}
.rk{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.rk .flag{width:14px;height:10px;border-radius:2px;border:1.5px solid #000;flex:none}
.rk .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rk.me{color:var(--gold);font-weight:800}
.fac{border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-top:8px;background:#122034}
.fac h4{margin:0;display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:15px}
.fac .mm{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.5}
.fac button{min-height:34px;border-radius:9px;border:1px solid var(--line);background:#16263c;font-weight:700;font-size:12.5px;padding:0 10px}
.help{font-size:13.5px;line-height:1.55}
.help b{color:var(--gold)}
.help .st{display:flex;gap:10px;margin:9px 0;align-items:flex-start}
.help .st i{font-style:normal;font-size:22px;flex:none;width:30px;text-align:center}
#pickHint{position:fixed;left:50%;transform:translateX(-50%);top:calc(14px + env(safe-area-inset-top));z-index:5;background:var(--gold);color:#1b1206;font-weight:900;border-radius:12px;padding:10px 14px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.5);text-align:center}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:20;background:#07101d;font-weight:800;color:var(--muted)}

  const t = Math.floor(s.t); $("clock").textContent = "⏱ " + Math.floor(t / 60) + ":" + String(t % 60).padStart(2, "0");
  const fo = me.focus, fl = $("focusLine");

  $("bForm").classList.toggle("glow", (s.formReady || []).some(k => !(s.formedBy || {})[k]));
  { const st = Math.round(me.stab ?? 60); $("stab").textContent = (st >= 65 ? "😀 " : st >= 40 ? "😐 " : st >= 25 ? "😠 " : "🔥 ") + st; $("stab").style.color = st < 25 ? "#f87171" : st < 40 ? "#fbbf24" : ""; $("bInt").classList.toggle("glow", st < 35 || Object.keys(WZ.DECIS).some(k => !((me.cds || {})[k] > s.t) && k === "propaganda" && st < 50)); }
  const pz = $("peace");
  if (me.immuneUntil && s.t < me.immuneUntil && s.t >= s.peaceUntil) { pz.textContent = `🛡️ Startbescherming · nog ${Math.ceil(me.immuneUntil - s.t)}s niemand kan je aanvallen`; pz.classList.remove("hidden"); }

  // dreiging: vijandelijke legers die mij aanvallen (zee apart)
  const inc = s.armies.filter(a => a.o !== s.me && a.path.length && s.owner[a.path[0].q] === s.me && WZ.hostile(s, a.o, s.me));
  const al = $("alert");
  if (inc.length && s.t >= s.peaceUntil) {
    const sea = inc.filter(a => a.path[0].sea), tot = inc.reduce((x, a) => x + a.n, 0), who = [...new Set(inc.map(a => nm(a.o)))].slice(0, 2).join(" & ");
    al.innerHTML = `<span>${sea.length ? "⛵ Landing" : "⚔️ Aanval"} van ${E(who)} · ${fmt(tot)} troepen!</span><b>📍 Bekijk</b>`; al._p = inc[0].path[0].q; al.classList.remove("hidden");
  } else al.classList.add("hidden");
}

function onEvents(evs) {
  for (const e of evs) {
    if (e.type === "capture") { dirty.add(e.q); labelT = -9; if (e.o === s.me && s.t - lastLossToast > 8) { lastLossToast = s.t; toast(`⚠️ ${nm(e.by)} verovert een provincie van je!`); } }
    else if (e.type === "dead") { if (e.id === s.me || e.quiet) { } else if (e.by === s.me) toast(`💀 Je hebt ${s.nations[e.id].name} verslagen!`); }
    else if (e.type === "capital" && e.o === s.me) toast("⚠️ Je hoofdstad is gevallen! Er is een nieuwe gekozen.");
    else if (e.type === "join" && e.id !== s.me && s.nations[s.me].fac && e.fac === s.nations[s.me].fac) toast(`🤝 ${nm(e.id)} sluit zich aan bij je alliantie`);
    else if (e.type === "leave" && e.id !== s.me && e.fac === s.nations[s.me].fac) toast(`🚪 ${nm(e.id)} verlaat je alliantie`);
    else if (e.type === "traitor" && e.vs === s.me) toast(`🗡️ ${nm(e.id)} verraadt jou!`);
    else if (e.type === "revolt") { dirty.add(e.q); labelT = -9; if (e.id === s.me) toast("🔥 Opstand! Een provincie scheurt zich af. Verhoog je stabiliteit via 🏛️"); }
    else if (e.type === "split") {
      for (const k of [e.p, e.q]) { pBox.delete(k); sOrd.delete(k); dirty.add(k); for (const r of w.adj[k]) dirty.add(r); } labelT = -9;
      if (e.a === s.me || e.b === s.me) toast(`✂️ Jij en ${nm(e.a === s.me ? e.b : e.a)} vielen tegelijk aan: de provincie is gedeeld`);
    }
    else if (e.type === "union") { for (const q of e.ps) dirty.add(q); labelT = -9; toast(e.id === s.me ? `🫱🏻‍🫲🏽 ${s.nations[e.t].name} sluit zich bij je aan! +${e.ps.length} provincie${e.ps.length === 1 ? "" : "s"}` : `📢 ${s.nations[e.t].name} gaat op in ${nm(e.id)}`); }
    else if (e.type === "annex") { for (const q of e.ps) dirty.add(q); labelT = -9; toast(e.id === s.me ? `🤝 Je lijft ${s.nations[e.t].name} in!` : `📢 ${nm(e.id)} lijft ${s.nations[e.t].name} in`); }
    else if (e.type === "annexFail" && e.id === s.me) toast(`❌ ${s.nations[e.t].name} is te groot om in te lijven`);
    else if (e.type === "pact" && (e.id === s.me || e.with === s.me)) toast(`🤝 Bondgenootschap met ${nm(e.id === s.me ? e.with : e.id)}`);
    else if (e.type === "formReady") toast(`👑 Je kunt nu ${e.naam} vormen! Tik op 👑 Rijken`);
    else if (e.type === "formed") { labelT = -9; if (e.id === s.me) { setMyName(e.naam); setHudFlag(); } else toast(`📢 ${e.old} heeft ${e.naam} gevormd!`); }
    else if (e.type === "focus" && e.id === s.me) { const F = WZ.FOCUS[e.k]; toast(`🎯 Focus klaar: ${F.icon} ${F.naam} (${F.info})`); }
  }
}

// ---------- spelverloop ----------
let last = 0, acc = 0, lastSave = 0;
function loop(ts) {
  const dt = Math.min(0.25, (ts - (last || ts)) / 1000); last = ts;
  if (s && !s.over && !paused && !picking && $("ov").classList.contains("hidden")) {
    acc += dt * speed;
    while (acc >= 0.1) { acc -= 0.1; onEvents(WZ.tick(w, s, 0.1)); if (s.over) break; }
    if (sel && !s.armies.includes(sel)) { sel = null; if (card && card.army) hideCard(); }
    if (s.over) end();
    if (ts - lastSave > 20000) { lastSave = ts; save(); }
  }
  if (dirty.size) { paintProvs(dirty); dirty.clear(); }
  if (s && ts - siegeT > 120) { siegeT = ts; paintSieges(); }
  if (s && !picking && ts - lastHud > 250) { maybeReq(); maybeEvent(); lastHud = ts; hud(); if (card && card.upd) card.upd(); }
  // tekenvlak moet precies even groot zijn als het scherm, anders wordt de kaart uitgerekt (iPad na draaien)
  if (cv.clientWidth && (cv.clientWidth !== VW || cv.clientHeight !== VH)) resize();
  render();
  requestAnimationFrame(loop);
}

}
function end() {

  else if (!me.alive) ov(`<h2 class="big">☠️ JE BENT GEËLIMINEERD</h2><p>${me.killedBy ? E(nm(me.killedBy)) + " heeft je laatste provincie veroverd." : "Je laatste provincie is gevallen."}</p><p>Je hield het ${dur} vol.</p><p>Tip: zet aan het begin je legers aan de grens, en verdedig je hoofdstad.</p><button class="big red" id="eN" type="button">Revanche</button>`);

  $("eN").onclick = () => menu(null);
}
$("bPause").onclick = () => { if (!s || s.over) return; paused = !paused; $("bPause").textContent = paused ? "▶" : "⏸"; toast(paused ? "⏸ Gepauzeerd" : "▶ Verder"); };
$("bMenu").onclick = pauseMenu; $("bRank").onclick = ranking; $("bFac").onclick = facPanel; $("bFocus").onclick = focusPanel; $("bForm").onclick = formPanel; $("bInt").onclick = intPanel;
let focusTab = "nat", focusSnooze = -1;
const FTABS = [["nat", "🏳️ Nationaal"], ["pol", "🏛️ Politiek"], ["ind", "🏭 Industrie"], ["eco", "💰 Economie"], ["tech", "🔬 Onderzoek"], ["leger", "🪖 Leger"], ["lucht", "✈️ Lucht"], ["vloot", "⚓ Vloot"], ["log", "🚂 Logistiek"], ["dipl", "🌐 Diplomatie"]];
function focusPanel() {
  if (!s || s.over || picking) return; paused = true; $("bPause").textContent = "▶"; hideCard();
  const me = s.nations[s.me], fo = me.focus, tag = WZ.natTag(me);
  const keys = br => WZ.BRANCH[br].filter(k => { const F = WZ.FOCUS[k]; return (!F.tag || F.tag === tag) && (!F.claim || (me.nbTags || []).includes(F.claim) || fo.done.includes(k)); });
  const depth = {}; const dep = k => { if (depth[k] !== undefined) return depth[k]; const F = WZ.FOCUS[k]; const rs = [...F.req, ...(F.any || [])].filter(r => WZ.FOCUS[r].br === F.br); return depth[k] = rs.length ? 1 + Math.max(...rs.map(dep)) : 0; };
  const qu = fo.queue || [];
  const st = k => { const F = WZ.FOCUS[k]; return fo.done.includes(k) ? "done" : fo.cur === k ? "cur" : qu.includes(k) ? "q" : WZ.focusOk(me, k) ? "ok" : (F.excl && F.excl.some(x => fo.done.includes(x) || fo.cur === x || qu.includes(x))) ? "x" : WZ.canQueue(me, k) ? "qa" : "lock"; };
  const node = k => { const F = WZ.FOCUS[k], t = st(k), need = [...F.req.filter(r => !fo.done.includes(r))].map(r => WZ.FOCUS[r].naam), any = F.any && !F.any.some(r => fo.done.includes(r)) ? [F.any.map(r => WZ.FOCUS[r].naam).join(" of ")] : [];
    return `<button type="button" class="fn ${t}" data-k="${k}">${t === "q" ? `<span class="qn">${qu.indexOf(k) + 1}</span>` : ""}<i>${F.icon}</i>${E(F.naam)}<small>${t === "cur" ? "⏳ nog " + Math.ceil(fo.left) + "s" : t === "done" ? "✓ klaar" : t === "q" ? "📋 ingepland · tik om te schrappen" : E(F.info)}</small>${t === "lock" && need.concat(any).length ? `<span class="rq">🔒 na ${E(need.concat(any).join(", "))}</span>` : ""}</button>`; };
  const cnt = br => keys(br).filter(k => st(k) === "ok").length;
  const ks = keys(focusTab), rows = {}; for (const k of ks) (rows[dep(k)] = rows[dep(k)] || []).push(k);
  const done = Object.values(WZ.FOCUS).filter(F => fo.done.includes(F.k)).length, tot = FTABS.reduce((a, [b]) => a + keys(b).length, 0);
  ov(`<h2>🎯 Focusboom</h2><p>${done} van ${tot} focussen klaar${fo.cur ? ` · nu: ${WZ.FOCUS[fo.cur].icon} ${E(WZ.FOCUS[fo.cur].naam)} (nog ${Math.ceil(fo.left)}s)` : ""}. Eén tegelijk; elke focus geeft een blijvende bonus.</p>
    <div class="ftabs">${FTABS.map(([b, l]) => `<button type="button" data-tab="${b}" class="${b === focusTab ? "on" : ""}">${l}${cnt(b) ? `<b>${cnt(b)}</b>` : ""}</button>`).join("")}</div>
    <p style="font-size:12.5px">💡 Tik meerdere focussen aan: ze komen in de <b style="color:var(--ink)">wachtrij</b> (${qu.length}) en starten vanzelf na elkaar. Paars gestippeld = kan in de wachtrij.</p>
    ${focusTab === "nat" ? `<p style="font-size:12.5px">${tag === "*" ? "Algemene nationale tak (" + E(me.name) + " heeft nog geen eigen tak)." : "Eigen tak van " + E(tag) + ": speciale bonussen, bondgenoten en landen inlijven."} Inlijven lukt alleen als dat land kleiner is dan jij.</p>` : focusTab === "dipl" ? `<p style="font-size:12.5px">Na Ambassades kun je een claim leggen op elk buurland. Is dat land kleiner dan jij, dan lijf je het in. Anders krijg je +4% aanval.</p>` : focusTab === "pol" ? `<p style="font-size:12.5px">Kies één ideologie, definitief. Die bepaalt je alliantie: 🔵 Geallieerden, ⚫ Asmogendheden, 🔴 Komintern of 👑 Heilige Alliantie.</p>` : ""}
    <div class="ftree">${Object.keys(rows).sort((a, b) => a - b).map(d => `<div class="frow">${+d === 0 ? "START" : "NIVEAU " + (+d + 1)}</div>` + rows[d].map(node).join("")).join("")}</div>
    <button class="big red" id="fB" type="button">Verder spelen</button>`);
  $("ovc").onclick = e => {
    const t = e.target.closest("[data-tab]"); if (t) { focusTab = t.dataset.tab; focusPanel(); return; }
    const b = e.target.closest(".fn.ok,.fn.qa,.fn.q"); if (!b) return; const k = b.dataset.k;
    if (b.classList.contains("q")) { WZ.unqueueFocus(s, s.me, k); focusPanel(); return; }
    const r = WZ.queueFocus(s, s.me, k); if (r === "start") toast(`🎯 Focus gestart: ${WZ.FOCUS[k].naam}`); else if (r === "queue") toast(`📋 In de wachtrij: ${WZ.FOCUS[k].naam}`); focusPanel();
  };
  $("fB").onclick = () => { $("ovc").onclick = null; if (!fo.cur) focusSnooze = s.t + 60; resumePlay(); };
}

// ---------- kaart laden ----------
const mapCache = {}, mapG = {};
const mapKey = () => settings.map === "mega" ? "wereld-mega" : settings.map + "-" + settings.size;
async function loadMap(id) {
  $("loading").classList.remove("hidden");

  off = document.createElement("canvas"); off.width = W; off.height = H; octx = off.getContext("2d"); img = octx.createImageData(W, H); px = img.data;
  await loadKlimaat(); makeTerrain(); $("loading").classList.add("hidden");
}

// ---------- opslaan ----------
async function save() {
  if (!s || s.over || picking || !s.me) return;
  const data = { map: mapId, naam: s.nations[s.me].name, json: WZ.serialize(s), at: new Date().toISOString() };
  try { localStorage.setItem("wwz2", JSON.stringify(data)); } catch (e) { }
  if (db && uid) try { await db.doc("data/users/" + uid + "/wwz2").set(data); } catch (e) { }
}
async function clearSave() { try { localStorage.removeItem("wwz2"); } catch (e) { } if (db && uid) try { await db.doc("data/users/" + uid + "/wwz2").delete(); } catch (e) { } }
async function resume(d) {
  closeOv(); await loadMap(d.map); const sv = WZ.deserialize(w, d.json);
  if (!sv || sv.over) { toast("Dit spel kon niet geladen worden"); menu(null); return; }
  s = sv; picking = false; nextEv = s.t + 60; for (const n of s.nations) if (n && n.flagDef) { FL[n.flag] = n.flagDef; delete flagURLs[n.flag]; } paintAll(); labelT = -9;
  setMyName(s.nations[s.me].name); setHudFlag();
  $("hud").classList.remove("hidden"); $("bottom").classList.remove("hidden"); $("bar").classList.remove("hidden"); $("pctLbl").classList.remove("hidden");
  focusProv(s.nations[s.me].capital, Math.max(minScale() * 2.2, 3 / w.L)); paused = false; $("bPause").textContent = "⏸";
}
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });

// ---------- start ----------
window.__wwz = () => ({ s, w, WZ, provAt, scrX, scrY, armyPos, provCard, armyCard, orderTo, setFrac, flagPanel, get sel() { return sel; } });
resize(); requestAnimationFrame(loop);
(async () => {
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem("wwz2") || "null"); } catch (e) { }
  try {
    if (window.claude) { db = await claude.use("db"); const u = await claude.use("user"); uid = u ? await u.id() : null; }
    if (db && uid) { const snap = await db.doc("data/users/" + uid + "/wwz2").get(); if (snap.exists) { const d = snap.data(); if (!saved || String(d.at) > String(saved.at)) saved = d; } }
  } catch (e) { db = null; }
  // achtergrondkaart voor het menu
  try { await loadMap(mapKey()); s = null; paintAll(); scale = minScale(); if (w.wrap) ox = VW / 2 - W * 0.53 * scale; clampView(); } catch (e) { $("loading").textContent = "Kaart laden mislukt. Probeer het opnieuw."; return; }
  menu(saved && saved.json ? saved : null);
})();
})();
</script>
