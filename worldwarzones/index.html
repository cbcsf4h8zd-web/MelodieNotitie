<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>WorldWarZones</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="WorldWarZones">
<meta name="application-name" content="WorldWarZones">
<meta name="theme-color" content="#050505">
<link rel="apple-touch-icon" href="icon-180.png?v=3">
<link rel="manifest" href="manifest.webmanifest">

<link rel="icon" type="image/svg+xml" href="icon.svg">
<style>
:root{--panel:rgba(12,20,32,.94);--ink:#eef2f7;--muted:#97a6b8;--line:#22344c;--gold:#f5a524;--red:#e5484d;--blue:#2f7cf6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b1a2c;color:var(--ink);font:14px/1.3 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#cv{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block}
#hud{position:fixed;left:8px;right:8px;top:calc(8px + env(safe-area-inset-top));display:flex;gap:6px;align-items:flex-start;pointer-events:none}
.box{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:6px 9px;pointer-events:auto}
#me{flex:1;min-width:0}
#me .row{display:flex;justify-content:space-between;gap:8px;font-weight:700;font-variant-numeric:tabular-nums;font-size:13px}
.bar{height:6px;border-radius:3px;background:#1d2d44;margin-top:4px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue)}
#goal{font-size:11.5px;color:var(--muted);margin-top:3px;display:flex;justify-content:space-between}
#goal b{color:var(--gold)}
.tbtn{width:38px;height:38px;border-radius:11px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:16px;font-weight:700;pointer-events:auto}
#banner{position:fixed;left:8px;top:calc(100px + env(safe-area-inset-top));max-width:calc(54% - 14px);white-space:normal!important;border-radius:12px!important;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-size:13px;font-weight:600;white-space:nowrap;pointer-events:none}
#toasts{position:fixed;left:8px;right:8px;bottom:calc(112px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:4px;align-items:flex-start;pointer-events:none}
.toast{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 10px;font-size:12.5px;max-width:100%;animation:fade 4.5s forwards}
@keyframes fade{0%{opacity:0;transform:translateY(6px)}6%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0}}
#bottom{position:fixed;left:8px;right:8px;bottom:calc(8px + env(safe-area-inset-bottom));display:flex;gap:6px;align-items:center}
#ratio{flex:1;display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:4px}
#ratio button{flex:1;min-height:38px;border:0;border-radius:9px;background:transparent;color:var(--ink);font:inherit;font-weight:700;font-size:13px}
#ratio button.on{background:var(--red);color:#fff}
#ratioLbl{font-size:10px;color:var(--muted);text-align:center;margin-top:-1px}
#sheet{position:fixed;left:0;right:0;bottom:0;background:#0e1828;border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:14px 12px calc(14px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .18s;z-index:6;max-height:70%;overflow:auto}
#sheet.open{transform:none}
#sheet h3{margin:0;font-size:17px}
#sheet .sub{color:var(--muted);font-size:13px;margin:2px 0 10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.grid button,.wide{min-height:52px;border-radius:12px;border:1px solid var(--line);background:#16263c;color:var(--ink);font:inherit;font-weight:650;font-size:13.5px;padding:6px 8px;text-align:left;line-height:1.2}
.grid button small,.wide small{display:block;color:var(--muted);font-weight:500;font-size:11.5px;margin-top:2px}
.grid button:disabled{opacity:.38}
.wide{width:100%;margin-top:8px;text-align:center}
.red{background:var(--red)!important;border-color:var(--red)!important;color:#fff!important}
.red small{color:#ffe0e0!important}
#ov{position:fixed;inset:0;background:rgba(3,7,13,.86);display:flex;align-items:center;justify-content:center;padding:18px;z-index:8;overflow:auto}
#ov .card{background:#0e1828;border:1px solid var(--line);border-radius:18px;padding:18px;max-width:380px;width:100%}
#ov h2{margin:0 0 4px;font-size:24px;text-align:center}
#ov p{color:var(--muted);margin:0 0 10px;text-align:center}
.lab{font-size:12px;color:var(--muted);margin:12px 0 5px}
.seg{display:flex;gap:6px}
.seg button{flex:1;min-height:42px;border-radius:10px;border:1px solid var(--line);background:#16263c;color:var(--ink);font:inherit;font-weight:650}
.seg button.on{background:var(--gold);border-color:var(--gold);color:#1b1206}
.big{width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line);background:#16263c;color:var(--ink);font:inherit;font-weight:800;font-size:16px;margin-top:12px}
.rank{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.rank .dot{width:12px;height:12px;border-radius:3px;flex:none}
.rank .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rank button{min-height:32px;border-radius:8px;border:1px solid var(--line);background:#16263c;color:var(--ink);font:inherit;font-size:12px;padding:0 8px}
.hidden{display:none!important}
#lb{pointer-events:auto!important}
.sh{font-size:11.5px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:12px 0 6px}
.sh:first-of-type{margin-top:4px}
.note{font-size:12.5px;color:var(--muted);background:#132136;border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
#ratioLbl2{font-size:10.5px;color:var(--muted);margin:0 0 3px 4px;font-weight:700;letter-spacing:.04em}
.mrow{display:flex;gap:6px;margin-top:8px}
.mrow .big{margin-top:0}
.help{color:var(--ink);font-size:13.5px;line-height:1.5;text-align:left}
.help b{color:var(--gold)}
#focusLine{font-size:11.5px;margin-top:3px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#focusLine.pick{color:var(--gold);font-weight:800}
@keyframes blink{50%{opacity:.45}}
#acts button.on{background:var(--gold);border-color:var(--gold);color:#1b1206}
.ftree{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:6px}
.fn{min-height:64px;border-radius:11px;border:1px solid var(--line);background:#16263c;color:var(--ink);font:inherit;font-size:11.5px;font-weight:700;padding:5px 4px;line-height:1.2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.fn i{font-style:normal;font-size:19px}
.fn small{font-weight:500;color:var(--muted);font-size:10px;margin-top:2px}
.fn.done{background:#14532d;border-color:#22c55e}
.fn.cur{background:#3b2a07;border-color:var(--gold)}
.fn.ok{border-color:#60a5fa;box-shadow:0 0 0 1px #60a5fa inset}
.fn.lock{opacity:.4}
.fn.x{opacity:.25;text-decoration:line-through}
.fn.empty{visibility:hidden}
.frow{grid-column:1/-1;font-size:10.5px;color:var(--muted);font-weight:800;letter-spacing:.06em;margin-top:6px}
.fac{border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin-top:8px;background:#122034}
.fac h4{margin:0;font-size:15px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.fac .mm{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
.fac button{min-height:34px;border-radius:9px;border:1px solid var(--line);background:#16263c;color:var(--ink);font:inherit;font-size:12.5px;font-weight:700;padding:0 10px}
#ovCard input{width:100%;min-height:42px;border-radius:10px;border:1px solid var(--line);background:#16263c;color:var(--ink);font:inherit;padding:0 10px;margin-top:6px}
#lb{position:fixed;right:8px;top:calc(100px + env(safe-area-inset-top));background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 8px;font-size:11.5px;min-width:120px;max-width:46%;pointer-events:none}
#lb div{display:flex;gap:5px;align-items:center;white-space:nowrap;overflow:hidden}
#lb i{width:8px;height:8px;border-radius:2px;flex:none}
#lb span{flex:1;overflow:hidden;text-overflow:ellipsis}
#acts{display:flex;gap:6px;margin-bottom:6px}
#sel{background:rgba(12,22,38,.97);border:1px solid var(--line);border-radius:14px;padding:10px;margin-bottom:8px;box-shadow:0 6px 24px rgba(0,0,0,.5)}
#sel .hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}
#sel .dot{width:14px;height:14px;border-radius:4px;border:2px solid #000;flex:none}
#sel .nmx{font-weight:800;font-size:16px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#sel .rel{font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:999px;background:#1d2b40;color:var(--muted);white-space:nowrap}
#sel .info{font-size:12px;color:var(--muted);margin:-4px 0 8px}
#sel .btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
#sel button{min-height:46px;border-radius:11px;border:1px solid var(--line);background:#16263c;color:var(--ink);font:inherit;font-size:14px;font-weight:800}
#sel button.atk{background:#b91c1c;border-color:#ef4444;color:#fff}
#sel button.ally{background:#1d4ed8;border-color:#60a5fa;color:#fff}
#sel button.no{background:transparent}
#sel button:disabled{opacity:.4}
#threat{position:fixed;left:8px;right:8px;top:calc(150px + env(safe-area-inset-top));z-index:6;background:#7f1d1d;border:2px solid #ef4444;border-radius:12px;padding:9px 12px;color:#fff;font-weight:800;font-size:13.5px;display:flex;align-items:center;gap:8px;box-shadow:0 6px 20px rgba(0,0,0,.5)}
#threat span{flex:1}
#toasts.up{bottom:calc(270px + env(safe-area-inset-bottom))!important}
#threat b{background:#fff;color:#7f1d1d;border-radius:8px;padding:5px 9px;font-size:12.5px;white-space:nowrap}
#acts button{flex:1;min-height:36px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font:inherit;font-size:12.5px;font-weight:700}
#acts button:disabled{opacity:.4}
.maps{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.maps button{min-height:40px;border-radius:10px;border:1px solid var(--line);background:#16263c;color:var(--ink);font:inherit;font-weight:650}
.maps button.on{background:var(--gold);border-color:var(--gold);color:#1b1206}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="hud" class="hidden">
  <div class="box" id="me">
    <div class="row"><span>👥 <span id="tr">0</span><span style="color:var(--muted);font-weight:500"> / <span id="cap">0</span></span></span><span>💰 <span id="gd">0</span></span></div>
    <div class="bar"><i id="trBar" style="width:0"></i></div>
    <div id="goal"><span>🌍 <span id="pct">0%</span> · <b>DOEL 80%</b></span><span id="clock">0:00</span></div>
    <div id="focusLine"></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:6px;pointer-events:none">
    <div style="display:flex;gap:6px"><button class="tbtn" id="bPause" type="button" aria-label="Pauze">⏸</button><button class="tbtn" id="bMenu" type="button" aria-label="Menu">☰</button></div>
    <div style="display:flex;gap:6px;justify-content:flex-end"><button class="tbtn" id="bFocus" type="button" aria-label="Focusboom">🎯</button><button class="tbtn" id="bFac" type="button" aria-label="Allianties">🤝</button></div>
  </div>
</div>
<div id="banner" class="hidden"></div>
<div id="lb" class="hidden" role="button" aria-label="Ranglijst openen"></div>
<div id="toasts"></div>
<div id="threat" class="hidden" role="button"></div>
<div id="bottom" class="hidden">
  <div style="flex:1">
    <div id="sel" class="hidden"></div>
    <div id="acts"><button type="button" id="bArrow">🏹 Pijl</button><button type="button" id="bRetreat">↩️ Terug</button><button type="button" id="bReinf">➕ Versterking</button><button type="button" id="bMe" style="flex:0 0 44px" aria-label="Naar mijn land">📍</button></div>
    <div id="ratioLbl2">⚔️ TROEPEN PER AANVAL</div>
    <div id="ratio">
      <button type="button" data-v="0.1">10%</button><button type="button" data-v="0.25">25%</button><button type="button" data-v="0.35" class="on">35%</button><button type="button" data-v="0.5">50%</button><button type="button" data-v="0.75">75%</button><button type="button" data-v="1">100%</button>
    </div>
  </div>
</div>
<div id="sheet"></div>
<div id="ov"><div class="card" id="ovCard"></div></div>

<script>

// WorldWarZones tile engine v5 (RoFront/OpenFront style)
const TF = (() => {
  const COLORS = ["#6e7781", "#2f7cf6", "#e5484d", "#30a46c", "#8e4ec6", "#f5a524", "#12a594", "#d6409f", "#c2410c", "#65a30d", "#0ea5e9", "#be185d", "#7c3aed", "#ca8a04", "#0f766e", "#b45309", "#4f46e5", "#16a34a", "#db2777", "#0891b2", "#a16207", "#9333ea", "#dc2626", "#059669", "#2563eb", "#ea580c", "#84cc16", "#e11d48", "#14b8a6", "#f97316", "#6366f1"];
  for (let i = 0; COLORS.length < 100; i++) { const h = (i * 137.508) % 360, l = 48 + (i % 3) * 7; const c = (1 - Math.abs(2 * l / 100 - 1)) * 0.92, x = c * (1 - Math.abs((h / 60) % 2 - 1)), m = l / 100 - c / 2; const [r, g, b] = h < 60 ? [c, x, 0] : h < 120 ? [x, c, 0] : h < 180 ? [0, c, x] : h < 240 ? [0, x, c] : h < 300 ? [x, 0, c] : [c, 0, x]; COLORS.push("#" + [r, g, b].map(v => Math.round((v + m) * 255).toString(16).padStart(2, "0")).join("")); }
  const K = 1000, M = 1e6;
  const BUILD = {
    stad: { naam: "Stad", icon: "🏙️", base: 125 * K, max: 1 * M, info: "+25K troepencap, sneller groeien" },
    fabriek: { naam: "Fabriek", icon: "🏭", base: 125 * K, max: 1 * M, info: "goud + wegen met vrachtwagens" },
    haven: { naam: "Haven", icon: "⚓", base: 250 * K, max: 1 * M, info: "handel, snelle boten, oorlogsschepen", coast: true },
    post: { naam: "Verdedigingspost", icon: "🛡️", base: 50 * K, max: 250 * K, info: "aanvallers 5× troepen + 3× trager" },
    silo: { naam: "Raketsilo", icon: "🚀", base: 1 * M, max: 1 * M, info: "nodig voor alle bommen" },
    sam: { naam: "SAM-raket", icon: "🎯", base: 1.5 * M, max: 3 * M, info: "schiet bommen neer (niet MIRV)" }
  };
  const BOMBS = {
    atoom: { naam: "Atoombom", icon: "☢️", cost: 750 * K, r: 12 },
    mega: { naam: "Mega-atoombom", icon: "☢️☢️", cost: 2.5 * M, r: 18 },
    waterstof: { naam: "Waterstofbom", icon: "💥", cost: 5 * M, r: 26 },
    mirv: { naam: "MIRV", icon: "🎆", cost: 25 * M, r: 5, heads: 40 }
  };
  const SHIP = { naam: "Oorlogsschip", icon: "🚢", base: 250 * K, max: 750 * K };
  const DIFF = {
    relaxed: { naam: "Relaxed", grow: 0.85, th: 0.55, prot: 90, gang: false, rush: 0.35, start: 2500 },
    standaard: { naam: "Standaard", grow: 1.15, th: 0.4, prot: 60, gang: true, rush: 0.5, start: 3000 },
    brutaal: { naam: "Brutaal", grow: 1.8, th: 0.2, prot: 60, gang: true, rush: 0.7, start: 5000 }
  };
  const WIN = 0.8;
  const FOCUS = {
    industrie: { naam: "Industrialisatie", icon: "🏭", tijd: 40, req: [], fx: { gold: 0.25 }, info: "+25% goud" },
    leger: { naam: "Herbewapening", icon: "🪖", tijd: 45, req: ["industrie"], fx: { grow: 0.2 }, info: "+20% troepengroei" },
    marine: { naam: "Vlootbouw", icon: "⚓", tijd: 40, req: ["industrie"], fx: { navy: 1 }, info: "boten 50% sneller, havens half geld" },
    atoom: { naam: "Atoomprogramma", icon: "☢️", tijd: 60, req: ["marine"], fx: { nuke: -0.3 }, info: "bommen en silo's 30% goedkoper" },
    demo: { naam: "Democratie", icon: "🔵", tijd: 50, req: ["leger"], excl: ["fasc", "comm"], ideo: "demo", fx: { def: 0.3 }, info: "verdediging +30%, makkelijker bondgenoten" },
    fasc: { naam: "Fascisme", icon: "⚫", tijd: 50, req: ["leger"], excl: ["demo", "comm"], ideo: "fasc", fx: { atk: 0.2 }, info: "aanvallen 20% goedkoper" },
    comm: { naam: "Communisme", icon: "🔴", tijd: 50, req: ["leger"], excl: ["demo", "fasc"], ideo: "comm", fx: { cap: 0.3 }, info: "+30% maximale troepen" },
    demo2: { naam: "Arsenaal der democratie", icon: "🏦", tijd: 55, req: ["demo"], fx: { gold: 0.4 }, info: "+40% goud" },
    fasc2: { naam: "Blitzkrieg", icon: "⚡", tijd: 55, req: ["fasc"], fx: { speed: 0.5 }, info: "aanvallen 50% sneller" },
    comm2: { naam: "Wereldrevolutie", icon: "☭", tijd: 55, req: ["comm"], fx: { grow: 0.3, atk: 0.1 }, info: "+30% groei, aanvallen 10% goedkoper" },
    demo3: { naam: "Vrije wereld", icon: "🗽", tijd: 70, req: ["demo2"], fx: { def: 0.2, cap: 0.15 }, info: "verdediging +20%, +15% max troepen" },
    fasc3: { naam: "Totale oorlog", icon: "🔥", tijd: 70, req: ["fasc2"], fx: { atk: 0.15, grow: 0.15 }, info: "aanvallen 15% goedkoper, +15% groei" },
    comm3: { naam: "Vijfjarenplan", icon: "🏗️", tijd: 70, req: ["comm2"], fx: { gold: 0.3, cap: 0.15 }, info: "+30% goud, +15% max troepen" }
  };
  const IDEO = { demo: { naam: "Geallieerden", icon: "🔵", kleur: "#3b82f6" }, fasc: { naam: "Asmogendheden", icon: "⚫", kleur: "#6b7280" }, comm: { naam: "Komintern", icon: "🔴", kleur: "#dc2626" } };
  function calcFx(n) {
    const f = { gold: 1, grow: 1, cap: 1, atk: 1, def: 1, speed: 1, nuke: 1, navy: 0 };
    for (const k of (n.focus ? n.focus.done : [])) { const F = FOCUS[k]; if (!F) continue; for (const e in F.fx) f[e] += F.fx[e]; }
    n.fx = f; return f;
  }
  const FX = n => n.fx || calcFx(n);
  function focusOk(n, k) {
    const F = FOCUS[k], fo = n.focus; if (!F || !fo) return false;
    if (fo.done.includes(k) || fo.cur) return false;
    if (!F.req.every(r => fo.done.includes(r))) return false;
    if (F.excl && F.excl.some(r => fo.done.includes(r) || fo.cur === r)) return false;
    return true;
  }
  function startFocus(s, id, k) { const n = s.nations[id]; if (!focusOk(n, k)) return false; n.focus.cur = k; n.focus.left = FOCUS[k].tijd; return true; }

  function makeWorld(G) {
    const W = G.W, H = G.H, N = W * H, wrap = !!G.wrap;
    const bin = typeof atob === "function" ? Uint8Array.from(atob(G.r), c => c.charCodeAt(0)) : new Uint8Array(Buffer.from(G.r, "base64"));
    const runs = new Uint16Array(bin.buffer, bin.byteOffset, bin.byteLength >> 1);
    const ctry = new Uint8Array(N); let p = 0;
    for (let k = 0; k < runs.length; k += 2) { ctry.fill(runs[k], p, p + runs[k + 1]); p += runs[k + 1]; }
    const land = new Uint8Array(N); let landN = 0;
    for (let i = 0; i < N; i++) if (ctry[i] !== 255) { land[i] = 1; landN++; }
    const nb = wrap
      ? (i, out) => { const x = i % W, y = (i / W) | 0; let n = 0; out[n++] = y * W + (x + W - 1) % W; out[n++] = y * W + (x + 1) % W; if (y > 0) out[n++] = i - W; if (y < H - 1) out[n++] = i + W; return n; }
      : (i, out) => { const x = i % W, y = (i / W) | 0; let n = 0; if (x > 0) out[n++] = i - 1; if (x < W - 1) out[n++] = i + 1; if (y > 0) out[n++] = i - W; if (y < H - 1) out[n++] = i + W; return n; };
    const coast = new Uint8Array(N); const tmp = new Int32Array(4);
    for (let i = 0; i < N; i++) if (land[i]) { const n = nb(i, tmp); for (let k = 0; k < n; k++) if (!land[tmp[k]]) { coast[i] = 1; break; } }

function onEvents(ev) {
  for (const e of ev) {
    if (e.type === "dead") { if (e.id === 1) toast(`☠️ Je bent geëlimineerd door ${nm(e.by)}`); }
    else if (e.type === "boatgo" && e.o === 1 && e.by !== 1) toast(`⚠️ ${nm(e.by)} stuurt een transport met ${fmt(e.troops)} troepen naar je kust!`);
    else if (e.type === "landing" && e.by === 1) toast(`⛵ Je troepen zijn geland${e.o ? " bij " + nm(e.o) : ""}!`);
    else if (e.type === "landing" && e.o === 1) toast(`⚠️ ${nm(e.by)} landt op jouw kust!`);
    else if (e.type === "bombout" && e.o === 1) toast(`🚨 ${nm(e.by)} vuurt een ${TF.BOMBS[e.kind].naam.toLowerCase()} op jou af!`);
    else if (e.type === "boom") { booms.push({ t: e.to, r: e.r, t0: performance.now() }); dirty = true; }
    else if (e.type === "sunk" && (e.by === 1 || e.o === 1)) toast(e.by === 1 ? `🚢 Jouw schip laat een boot van ${nm(e.o)} zinken` : `🚢 ${nm(e.by)} laat jouw boot zinken!`);
    else if (e.type === "shipdown" && (e.by === 1 || e.o === 1)) toast(e.by === 1 ? `🚢 Je schip vernietigt een oorlogsschip van ${nm(e.o)}` : "🚢 Je oorlogsschip is gezonken");
    else if (e.type === "shotdown" && (e.o === 1 || e.by === 1)) toast(`🎯 SAM van ${nm(e.o)} schiet een bom van ${nm(e.by)} neer`);
    else if (e.type === "traitor" && e.vs === 1) toast(`⚠️ ${nm(e.id)} verraadt jou!`);
    else if (e.type === "boatfail" && e.by === 1) toast("⛵ Je landing is mislukt");
    else if (e.type === "focus" && e.id === 1) { const F = TF.FOCUS[e.k]; toast(`🎯 Focus klaar: ${F.icon} ${F.naam} (${F.info})`); }
    else if (e.type === "join") { const f = TF.facOf(s, e.fac); if (f && s.nations[1].fac === e.fac && e.id !== 1) toast(`🤝 ${nm(e.id)} sluit zich aan bij ${f.naam}`); }
    else if (e.type === "leave" && (e.id === 1 || s.nations[1].fac === e.fac)) toast(`🚪 ${nm(e.id)} verlaat de alliantie`);
    else if (e.type === "prov" && e.o === 1 && s.t - (onEvents.lp || -99) > 15) { onEvents.lp = s.t; toast(`⚠️ ${nm(e.by)} neemt provincies van je in!`); }
  }
}

// ---------- loop ----------
function loop(ts) {
  requestAnimationFrame(loop);
  const dt0 = lastFrame ? Math.min(0.25, (ts - lastFrame) / 1000) : 0; lastFrame = ts;
  if (s && !s.over && !paused && $("ov").classList.contains("hidden")) {
    let dt = dt0 * speed;
    while (dt > 0) { const st = Math.min(0.1, dt); onEvents(TF.tick(w, s, st)); dt -= st; }
    if (ts - lastImg > (N > 600000 ? 300 : 170)) { lastImg = ts; dirty = true; }
    if (ts - lastCent > 900) { lastCent = ts; TF.centroids(w, s); }
    if (ts - lastSave > 20000) { lastSave = ts; save(); }
    if (s.over) end();
  }
  if (s && !$("hud").classList.contains("hidden") && ts - (loop.h || 0) > 200) { loop.h = ts; hud(); }
  if (w && (scale * w.L >= 4) !== showProv) dirty = true;
  if (dirty) { paint(); dirty = false; }
  render();
}

function beginGame(t) {

  $("hud").classList.remove("hidden"); $("bottom").classList.remove("hidden"); $("lb").classList.remove("hidden"); paused = false; $("bPause").textContent = "⏸";
  focus(t, Math.max(scale, 4 / w.L)); dirty = true;
  toast(`📍 Je begint in ${w.names[w.ctry[t]] || "onbekend land"}. Tik op grijs land om uit te breiden!`);
  save();
}
function end() {
  hideSel(); $("threat").classList.add("hidden");
  save(); closeSheet();
  const won = s.over === "won";
  $("ovCard").innerHTML = won
    ? `<h2>🌍 Overwinning!</h2><p>Je beheerst ${(TF.share(w, s, 1) * 100).toFixed(1)}% van de wereld na ${Math.floor(s.t / 60)} minuten, op ${TF.DIFF[diff] ? TF.DIFF[diff].naam : diff} tegen ${nBots} landen.</p><p>${diff === "relaxed" ? "Klaar voor Standaard?" : diff === "standaard" ? "Durf je Brutaal?" : "Respect. Dit is het zwaarste niveau."}</p><button class="big red" id="oNew" type="button">Nieuw spel</button>`
    : `<h2>${s.nations[1].alive ? "💀 Verloren" : "☠️ JE BENT GEËLIMINEERD"}</h2><p>${!s.nations[1].alive ? `${s.nations[1].killedBy ? nm(s.nations[1].killedBy) + " heeft je laatste stukje land veroverd." : "Je laatste stukje land is veroverd."}` : s.winner && s.winner !== 1 ? nm(s.winner) + " heeft 80% van de wereld." : ""} Je hield het ${s.t < 60 ? Math.round(s.t) + " seconden" : Math.floor(s.t / 60) + " minuten"} vol.</p><p>Tip: bouw vroeg een 🏙️ stad en een 🛡️ verdedigingspost aan je grens.</p><button class="big red" id="oNew" type="button">Revanche</button>`;
  $("ov").classList.remove("hidden"); $("oNew").onclick = menu;
}
function ranking() {
  paused = true;
  const list = s.nations.filter(n => n && n.alive).sort((a, b) => b.tiles - a.tiles);
  $("ovCard").innerHTML = `<h2>🏆 Ranglijst</h2><p>Doel: 80% van de wereld</p>` + list.map(n => `<div class="rank"><span class="dot" style="background:${TF.COLORS[n.id % TF.COLORS.length]}"></span><span class="nm">${n.ideo ? TF.IDEO[n.ideo].icon + " " : ""}${n.id === 1 ? "<b>Jij</b>" : n.name}${TF.allied(s, 1, n.id) ? " 🤝" : ""}${n.traitorUntil > s.t ? " ⚠️" : ""}</span><span>${(TF.share(w, s, n.id) * 100).toFixed(1)}%</span><span style="color:var(--muted);width:46px;text-align:right">${fmt(n.troops)}</span>${n.id !== 1 && !TF.allied(s, 1, n.id) ? `<button type="button" data-a="${n.id}">🤝</button>` : ""}</div>`).join("") + `<button class="big red" id="oBack" type="button">Verder spelen</button>`;
  $("ov").classList.remove("hidden");
  $("ovCard").onclick = e => { const id = +e.target.dataset.a; if (id) { const ok = TF.askAlly(s, 1, id); e.target.textContent = ok ? "✓" : "✗"; e.target.disabled = true; toast(ok ? `🤝 ${nm(id)} is je bondgenoot` : `${nm(id)} weigert`); } };
  $("oBack").onclick = () => { $("ovCard").onclick = null; $("ov").classList.add("hidden"); paused = false; $("bPause").textContent = "⏸"; };
}
$("ratio").onclick = e => { const b = e.target.closest("button"); if (!b) return; ratio = +b.dataset.v; [...$("ratio").children].forEach(x => x.classList.toggle("on", x === b)); };
$("bPause").onclick = () => { if (!s || s.over) return; paused = !paused; $("bPause").textContent = paused ? "▶" : "⏸"; };
$("bMe").onclick = () => { if (!s) return; TF.centroids(w, s); const n = s.nations[1]; if (!n.alive || n.cx == null) return; focus(Math.round(n.cy) * W + Math.round(n.cx), Math.max(scale, 3 / w.L)); dirty = true; };
$("lb").onclick = () => { if (s && !s.over) ranking(); };
const HELP = `<div class="help"><b>Doel:</b> verover 80% van de kaart.<br>
<b>Aanvallen:</b> tik op land dat niet van jou is. Kies onderin hoeveel van je troepen meegaan (10% tot 100%).<br>
<b>Bouwen:</b> tik op je eigen land. 🏙️ Stad = meer troepen, 🏭 Fabriek = meer goud, 🛡️ Post = sterkere verdediging.<br>
<b>Menu per land:</b> houd je vinger lang op een ander land voor boot, bondgenootschap en bommen.<br>
<b>Terugtrekken:</b> haalt troepen terug uit lopende aanvallen.<br>
<b>🏹 Pijl:</b> zet Pijl aan en sleep van jouw land naar een doel. Je leger rukt in die richting op, zoals in HOI.<br>
<b>🗺️ Provincies:</b> elk land is opgedeeld in provincies. Verover je meer dan de helft, dan valt de rest van die provincie ook.<br>
<b>🎯 Focus:</b> kies doelen voor bonussen. Na Herbewapening kies je Democratie, Fascisme of Communisme.<br>
<b>🤝 Allianties:</b> richt er zelf een op, word lid of nodig landen uit. Leden vallen elkaar niet aan.<br>
<b>Camera:</b> slepen = verschuiven, knijpen = zoomen, 📍 = terug naar je eigen land.<br>
<b>Tip:</b> val niet alles tegelijk aan. Wacht tot je balk bijna vol is en val dan met 50% aan.</div>`;
function help(back) { $("ovCard").innerHTML = `<h2>❔ Hoe speel je?</h2>${HELP}<button class="big red" id="hB" type="button">Terug</button>`; $("ov").classList.remove("hidden"); $("hB").onclick = back; }
function pauseMenu() {
  if (!s || s.over) return; paused = true; $("bPause").textContent = "▶";
  $("ovCard").onclick = null;
  $("ovCard").innerHTML = `<h2>⏸ Gepauzeerd</h2><p>${(TF.share(w, s, 1) * 100).toFixed(1)}% veroverd · ${Math.floor(s.t / 60)} min gespeeld</p>
    <button class="big red" id="pC" type="button">▶ Verder spelen</button>
    <div class="mrow"><button class="big" id="pR" type="button">🏆 Ranglijst</button><button class="big" id="pH" type="button">❔ Uitleg</button></div>
    <div class="lab">Snelheid</div>${segHtml("pS", [[1, "1×"], [2, "2×"], [3, "3×"]], speed)}
    <button class="big" id="pQ" type="button" style="margin-top:16px">🏳️ Stoppen en nieuw spel</button>`;
  $("ov").classList.remove("hidden");
  segBind("pS", v => { speed = +v; });
  $("pC").onclick = () => { $("ov").classList.add("hidden"); paused = false; $("bPause").textContent = "⏸"; };
  $("pR").onclick = ranking; $("pH").onclick = () => help(pauseMenu);
  $("pQ").onclick = () => { if ($("pQ").dataset.sure) { const old = s; s = null; save0(); menu(); } else { $("pQ").dataset.sure = 1; $("pQ").textContent = "Zeker? Je spel wordt gewist"; } };
}
$("bMenu").onclick = pauseMenu;
window.__wwz = () => ({ s, w, toTile, TF });
$("threat").onclick = () => { const t = $("threat")._t; if (t >= 0) { focus(t, Math.max(scale, 4 / w.L)); dirty = true; } };
$("bArrow").onclick = () => { arrowMode = !arrowMode; $("bArrow").classList.toggle("on", arrowMode); toast(arrowMode ? "🏹 Pijl-modus: sleep van jouw land naar je doel. Je leger rukt in die richting op." : "🏹 Pijl-modus uit, slepen = kaart verschuiven"); };
const FROWS = [["", "industrie", ""], ["leger", "", "marine"], ["demo", "fasc", "comm"], ["demo2", "fasc2", "comm2"], ["demo3", "fasc3", "comm3"], ["", "atoom", ""]];
function focusPanel() {
  if (!s || s.over) return; paused = true; $("bPause").textContent = "▶";
  const me = s.nations[1], fo = me.focus;
  const node = k => { if (!k) return `<div class="fn empty"></div>`; const F = TF.FOCUS[k]; const st = fo.done.includes(k) ? "done" : fo.cur === k ? "cur" : TF.focusOk(me, k) ? "ok" : (F.excl && F.excl.some(x => fo.done.includes(x) || fo.cur === x)) ? "x" : "lock";
    return `<button type="button" class="fn ${st}" data-k="${k}"><i>${F.icon}</i>${F.naam}<small>${st === "cur" ? Math.ceil(fo.left) + "s bezig" : st === "done" ? "✓ klaar" : F.info}</small></button>`; };
  $("ovCard").innerHTML = `<h2>🎯 Focusboom</h2><p>Kies één doel tegelijk. Na Herbewapening kies je een ideologie, en dat is definitief. Daarmee hoor je bij de ${TF.IDEO.demo.icon} Geallieerden, ${TF.IDEO.fasc.icon} As of ${TF.IDEO.comm.icon} Komintern.</p>
    <div class="ftree">${FROWS.map((r, i) => (i === 2 ? `<div class="frow">IDEOLOGIE · KIES ER ÉÉN</div>` : i === 5 ? `<div class="frow">VIA VLOOTBOUW</div>` : "") + r.map(node).join("")).join("")}</div>
    <button class="big red" id="fB" type="button">Verder spelen</button>`;
  $("ov").classList.remove("hidden");
  $("ovCard").onclick = e => { const b = e.target.closest(".fn"); if (!b || !b.classList.contains("ok")) return; const k = b.dataset.k; if (TF.startFocus(s, 1, k)) { toast(`🎯 Focus gestart: ${TF.FOCUS[k].naam}`); focusPanel(); } };
  $("fB").onclick = () => { $("ovCard").onclick = null; $("ov").classList.add("hidden"); paused = false; $("bPause").textContent = "⏸"; };
}
function facPanel() {
  if (!s || s.over) return; paused = true; $("bPause").textContent = "▶";
  const me = s.nations[1], myF = TF.facOf(s, me.fac), E = x => String(x).replace(/[<>&]/g, "");
  const mem = f => TF.members(s, f.id).sort((a, b) => b.tiles - a.tiles);
  const line = f => mem(f).map(n => `${n.id === f.leider ? "👑 " : ""}${n.id === 1 ? "<b>Jij</b>" : E(n.name)} ${(TF.share(w, s, n.id) * 100).toFixed(1)}%`).join(" · ");
  let h = `<h2>🤝 Allianties</h2><p>Leden vallen elkaar niet aan en helpen elkaar tegen de rest. Wie een bondgenoot bombardeert of verraadt, ligt eruit.</p>`;
  if (myF) h += `<div class="fac" style="border-color:var(--gold)"><h4><span>${myF.ideo ? TF.IDEO[myF.ideo].icon + " " : ""}${E(myF.naam)}</span><span style="font-size:12px;color:var(--gold)">JOUW ALLIANTIE</span></h4><div class="mm">${line(myF)}</div><div class="mm">Uitnodigen: houd je vinger lang op een land en kies 📨.</div><button type="button" data-a="leave" style="margin-top:8px">🚪 Verlaten</button></div>`;
  else h += `<div class="fac"><h4>Eigen alliantie oprichten</h4><input id="fName" maxlength="28" value="${me.ideo ? TF.IDEO[me.ideo].naam : "Bond van " + E(w.names[w.ctry[s.L[1][0]]] || "Vrijheid")}"><button type="button" data-a="new" style="margin-top:8px;width:100%">🏳️ Oprichten</button></div>`;
  const others = (s.factions || []).filter(f => f !== myF && mem(f).length);
  h += others.length ? others.map(f => `<div class="fac"><h4><span>${f.ideo ? TF.IDEO[f.ideo].icon + " " : ""}${E(f.naam)}</span>${myF ? "" : `<button type="button" data-a="join" data-f="${f.id}">Lid worden</button>`}</h4><div class="mm">${line(f)}</div></div>`).join("") : `<div class="mm" style="margin-top:10px;color:var(--muted);font-size:12.5px">Nog geen andere allianties. Die ontstaan zodra landen een ideologie kiezen.</div>`;
  h += `<button class="big red" id="aB" type="button">Verder spelen</button>`;
  $("ovCard").innerHTML = h; $("ov").classList.remove("hidden");
  $("ovCard").onclick = e => {
    const a = e.target.dataset.a; if (!a) return;
    if (a === "new") { const r = TF.createFaction(s, 1, $("fName").value.trim() || "Mijn alliantie"); toast(r.ok ? `🏳️ ${r.f.naam} opgericht` : r.err); facPanel(); }
    if (a === "join") { const f = TF.facOf(s, +e.target.dataset.f); const r = TF.askJoin(s, 1, f.id); toast(r.ok ? `🤝 Je zit nu in ${f.naam}` : `${f.naam}: ${r.err}`); facPanel(); }
    if (a === "leave") { if (e.target.dataset.sure) { TF.leaveFac(s, 1); facPanel(); } else { e.target.dataset.sure = 1; e.target.textContent = "Zeker?"; } }
  };
  $("aB").onclick = () => { $("ovCard").onclick = null; $("ov").classList.add("hidden"); paused = false; $("bPause").textContent = "⏸"; };
}
$("bFocus").onclick = focusPanel; $("bFac").onclick = facPanel;
async function save0() { try { localStorage.removeItem("wwz5"); } catch (e) { } if (!db || !uid) return; try { await db.doc("data/users/" + uid + "/wwz5").delete(); } catch (e) { } }
$("bRetreat").onclick = () => { if (!s) return; const b = TF.retreat(s, 1); if (b) toast(`↩️ ${fmt(b)} troepen teruggetrokken`); };
$("bReinf").onclick = () => { if (!s) return; const r = TF.buyReinf(w, s, 1); toast(r.ok ? `➕ ${fmt(r.add)} extra troepen` : "Versterking: " + r.err); };

async function save() { if (!s) return; if (!db || !uid) { try { localStorage.setItem("wwz5", JSON.stringify({ map: mapId, json: TF.serialize(s), at: new Date().toISOString() })); } catch (e) { } return; } try { await db.doc("data/users/" + uid + "/wwz5").set({ map: mapId, json: TF.serialize(s), at: new Date().toISOString() }); } catch (e) { } }
function resume(sv) {
  $("ovCard").innerHTML = `<h2>WorldWarZones</h2><p>Je hebt een spel lopen: ${(TF.share(w, sv, 1) * 100).toFixed(1)}% van de wereld, ${Math.floor(sv.t / 60)} minuten gespeeld.</p><button class="big red" id="oC" type="button">Doorgaan</button><button class="big" id="oN" type="button">Nieuw spel</button>`;
  $("ov").classList.remove("hidden");
  $("oC").onclick = () => { s = sv; TF.centroids(w, s); $("ov").classList.add("hidden"); $("hud").classList.remove("hidden"); $("bottom").classList.remove("hidden"); $("lb").classList.remove("hidden"); let t = s.owner.indexOf(1); if (t >= 0) focus(t, 4 / w.L); dirty = true; };
  $("oN").onclick = menu;
}
try { const ks = JSON.parse(localStorage.getItem("wwzSet") || "null"); if (ks) { nBots = ks.nBots || nBots; diff = ks.diff || diff; sizeSel = ks.sizeSel || sizeSel; mapSel = ks.mapSel || mapSel; } } catch (e) { }
addEventListener("resize", resize);
document.addEventListener("visibilitychange", () => { if (document.hidden) save(); });
resize(); menu(); requestAnimationFrame(loop);
loadMap("wereld-normaal").then(() => { if (!s && !spawning) { focus(Math.round(H * 0.4) * W + Math.round(W * 0.53), Math.max(VH * 0.5 / H, VW / W)); } }).catch(() => { });
(async () => {
  try {
    db = await claude.use("db"); const user = await claude.use("user"); uid = user ? await user.id() : null;
    if (!db || !uid) throw 0;
    const snap = await db.doc("data/users/" + uid + "/wwz5").get();
    if (snap.exists && !s && !spawning) { const d = snap.data(); await loadMap(d.map); const sv = TF.deserialize(w, d.json); if (sv && sv.v === 5 && !sv.over && sv.nations[1].alive && !s && !spawning) resume(sv); }
  } catch (e) {
    db = null;
    try { const d = JSON.parse(localStorage.getItem("wwz5") || "null"); if (d && !s && !spawning) { await loadMap(d.map); const sv = TF.deserialize(w, d.json); if (sv && sv.v === 5 && !sv.over && sv.nations[1].alive && !s && !spawning) resume(sv); } } catch (e2) { }
  }
})();
})();
